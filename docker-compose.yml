# Minimal docker-compose for self-hosting ITCake.
#
#  - Bind /data to a host directory so the SQLite DB + uploads + backups
#    + agent binaries + recordings survive container rebuilds.
#  - Set ORIGIN to your public URL — required for CSRF in production.
#  - SESSION_SECRET MUST be ≥ 32 random chars and treated like a TLS key.
#    Generate with: openssl rand -hex 32
#
# Reverse proxy in front terminates TLS (Caddy/nginx/Traefik). When the
# proxy sets X-Forwarded-For, set ADDRESS_HEADER accordingly so the
# rate-limit + audit log see the real client IP and not 127.0.0.1.
#
# Apache Guacamole's guacd is installed via the in-app Settings → Remote
# Desktop flow once you're up — not via compose. (The web container can
# manage the system package itself; guacd binds 127.0.0.1:4822.)

services:
  itcake:
    image: ghcr.io/k-it-ai/itcake:latest
    restart: unless-stopped
    # Allow puppeteer's Chromium to spawn renderer subprocesses without
    # the user-namespace sandbox. The container's non-root UID + the
    # /dev/shm tmpfs below replace that isolation.
    security_opt:
      - seccomp=unconfined
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: false
    tmpfs:
      - /tmp
      - /dev/shm:size=512m
    environment:
      ORIGIN: https://your-domain.example
      SESSION_SECRET: ${ITCAKE_SESSION_SECRET:?set in .env}
      # ADDRESS_HEADER + TRUST_PROXY: the container binds 0.0.0.0 inside
      # its own network namespace, which is the trust boundary — the
      # only reachable client is the reverse proxy you stand in front
      # via the published port. TRUST_PROXY=true tells the startup
      # invariant that this is a containerised deployment and the
      # 0.0.0.0 bind is safe. Drop both vars if you publish the
      # container's port directly to a hostile network.
      ADDRESS_HEADER: x-forwarded-for
      TRUST_PROXY: "true"
      LOG_LEVEL: info
    volumes:
      - itcake-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  itcake-data:
    driver: local
