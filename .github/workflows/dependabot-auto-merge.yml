name: Dependabot auto-merge

# When Dependabot opens a PR for a routine bump and CI passes, this enables
# auto-merge for non-major updates. Major bumps are NEVER auto-merged — they
# always need human review (potential breaking changes). The CI workflow's
# tests are the gate; this workflow only flips the auto-merge bit if those
# pass and severity is contained.
#
# !! SECURITY-CRITICAL: DO NOT add `actions/checkout` (or any other step
#    that runs PR-author-controlled code) to this workflow.
#    `pull_request_target` runs in the BASE-REPO context with secrets
#    (GITHUB_TOKEN with write permissions). Checking out the PR head
#    here would let any contributor's branch execute arbitrary code with
#    those secrets — instant exfil. The actor-check below (`github.actor
#    == 'dependabot[bot]'`) is GitHub-enforced and unspoofable, but only
#    matters if no untrusted code runs in the privileged context.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge only patch + minor for direct deps, and patch for indirect.
      # Major bumps stay open for human review.
      - name: Enable auto-merge (squash) for safe updates
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
