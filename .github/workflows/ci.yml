name: CI

# Two path-gated jobs so docs-only changes run nothing, app changes skip the
# Go lane and agent changes skip the Node lane. The app job keeps the whole
# pipeline on one runner (type-check → unit → build → integration) so the
# expensive setup happens once.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
      live_agent: ${{ steps.filter.outputs.live_agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'static/**'
              - 'tests/**'
              - 'scripts/**'
              - 'assets/**'
              - 'install.sh'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-agent.yml'
            live_agent:
              - 'agent/**'
              - 'src/**'
              - 'tests/live/agent-smoke.test.ts'
              - 'tests/live/helpers.ts'
              - 'vitest.live.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'

  app:
    name: Type-check, tests, build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit tests
        run: npm test -- --run tests/unit/
      # Catches SvelteKit-time errors the type-check alone misses:
      # server-only imports leaking to the client, missing page-server
      # modules, route conflicts.
      - name: Production build
        run: npm run build
      # Puppeteer's Chrome isn't installed by `npm ci` since v22; the
      # integration suite's PDF rendering needs a browser binary.
      - name: Install puppeteer Chrome
        run: npx puppeteer browsers install chrome
      # Ubuntu 24.04's AppArmor policy blocks unprivileged user namespaces, so
      # Chromium's namespace sandbox fails on GitHub's runner. Chrome for
      # Testing no longer ships the setuid helper, so relax the runner-only
      # AppArmor restriction and prove namespaces actually work. Production
      # grants the same permission through the unit's AppArmor profile.
      - name: Allow Chromium user-namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur true
      - name: Integration tests
        env:
          PUPPETEER_NO_SANDBOX: "true"
        run: npm test -- --run tests/integration/

  agent:
    name: Go agent (vet, test, cross-build)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Vet
        run: cd agent && go vet ./...
      - name: Govulncheck
        run: cd agent && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test
        run: cd agent && go test ./...
      - name: Cross-build (all 6 targets)
        run: |
          cd agent
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              EXT=""
              [ "$os" = "windows" ] && EXT=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o /tmp/itcake-agent-$os-$arch$EXT ./cmd/agent
            done
          done

  # Runs the real agent end-to-end on both host OSes: build the production
  # server, build the Go binary for the runner, enroll it, wait for a real
  # check-in, dispatch a command, and wait for the result. This is the only
  # job that exercises the Windows agent code at runtime rather than merely
  # cross-compiling it.
  agent-live:
    name: Agent live smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.live_agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The smoke test never renders a PDF; skip Puppeteer's Chrome download.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # better-sqlite3 13 ships a prebuilt win32-x64 binary, but npm injects
      # an implicit `node-gyp rebuild` install script (upstream npm/cli#9837).
      # The hosted Windows image has VS 18, which node-gyp 11 cannot detect,
      # so a normal `npm ci` fails before the test starts. No dependency in
      # this project needs a lifecycle script to build or run: the SQLite
      # binding is loaded straight from the package's prebuilds directory.
      - run: npm ci --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Enroll, check in, and run a command
        run: npx vitest run --config vitest.live.config.ts tests/live/agent-smoke.test.ts

  # Always-running gate for branch protection. The app/agent jobs are
  # path-gated, so a required check on either one would stay "pending" on
  # changes that skip it. This job succeeds when every triggered job passed
  # (skipped jobs are fine) and fails on any failure or cancellation. It is
  # also the single required status check on `main`, which is what makes
  # Dependabot auto-merge wait for CI instead of merging immediately.
  ci-success:
    name: CI success
    needs: [changes, app, agent, agent-live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
