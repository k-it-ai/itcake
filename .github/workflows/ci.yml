name: CI

# Two path-gated jobs so docs-only changes run nothing, app changes skip the
# Go lane and agent changes skip the Node lane. The app job keeps the whole
# pipeline on one runner (type-check → unit → build → integration) so the
# expensive setup happens once.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'static/**'
              - 'tests/**'
              - 'scripts/**'
              - 'assets/**'
              - 'install.sh'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-agent.yml'

  app:
    name: Type-check, tests, build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit tests
        run: npm test -- --run tests/unit/
      # Catches SvelteKit-time errors the type-check alone misses:
      # server-only imports leaking to the client, missing page-server
      # modules, route conflicts.
      - name: Production build
        run: npm run build
      # Puppeteer's Chrome isn't installed by `npm ci` since v22; the
      # integration suite's PDF rendering needs a browser binary.
      - name: Install puppeteer Chrome
        run: npx puppeteer browsers install chrome
      # Ubuntu 24.04's AppArmor policy blocks unprivileged user namespaces, so
      # Chromium's namespace sandbox fails on GitHub's runner. The production
      # integration suite deliberately refuses --no-sandbox; give it the
      # setuid sandbox helper instead so PDF generation is still exercised
      # with a real sandbox.
      - name: Enable Chromium setuid sandbox
        run: |
          SANDBOX="$(find "$HOME/.cache/puppeteer" -type f -name chrome-sandbox | head -n 1)"
          if [ -z "$SANDBOX" ]; then
            echo "chrome-sandbox not found in the Puppeteer cache" >&2
            exit 1
          fi
          # Keep the setuid helper in a root-owned directory, matching Chromium's
          # documented deployment; the runner's home directory is writable.
          sudo cp "$SANDBOX" /usr/local/sbin/chrome-devel-sandbox
          sudo chown root:root /usr/local/sbin/chrome-devel-sandbox
          sudo chmod 4755 /usr/local/sbin/chrome-devel-sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox" >> "$GITHUB_ENV"
      - name: Integration tests
        env:
          PUPPETEER_NO_SANDBOX: "true"
        run: npm test -- --run tests/integration/

  agent:
    name: Go agent (vet, test, cross-build)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Vet
        run: cd agent && go vet ./...
      - name: Govulncheck
        run: cd agent && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test
        run: cd agent && go test ./...
      - name: Cross-build (all 6 targets)
        run: |
          cd agent
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              EXT=""
              [ "$os" = "windows" ] && EXT=".exe"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o /tmp/itcake-agent-$os-$arch$EXT ./cmd/agent
            done
          done
