name: Dependency review

# `actions/dependency-review-action` requires GitHub Advanced Security on
# private repositories, which this repo does not have (same constraint
# that gated CodeQL on workflow_dispatch). The weekly security-audit job
# already covers the same ground via `npm audit` + the acknowledged-
# advisories filter, so this workflow stays manual-only as a parity check
# we can run on demand if needed.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Add GHSA IDs here only when the same IDs are listed in
          # .github/acknowledged-advisories.json and justified in the
          # "Upstream advisories" section of README.md.
