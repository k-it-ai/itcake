name: Dependency review

# Reviews dependency changes in pull requests for known vulnerabilities and
# license issues. Fails the PR if a HIGH/CRITICAL CVE is introduced. The
# Monday security-audit job catches these too, but blocking at PR time
# stops them from landing in the first place.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Keep this list in lock-step with .github/acknowledged-advisories.json
          # and the "Upstream advisories" section of CLAUDE.md. The advisories
          # listed here are tracked transitively (via puppeteer / @sveltejs/kit)
          # with near-zero exposure on this app's actual usage.
          allow-ghsas: GHSA-pxg6-pf52-xh8x, GHSA-gmq8-994r-jv83
