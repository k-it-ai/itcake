name: Dependency review

# `actions/dependency-review-action` requires GitHub Advanced Security on
# private repositories, which this repo does not have (same constraint
# that gated CodeQL on workflow_dispatch). The weekly security-audit job
# already covers the same ground via `npm audit` + the acknowledged-
# advisories filter, so this workflow stays manual-only as a parity check
# we can run on demand if needed.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Keep this list in lock-step with .github/acknowledged-advisories.json
          # and the "Upstream advisories" section of CLAUDE.md. The advisories
          # listed here are tracked transitively (via puppeteer / @sveltejs/kit)
          # with near-zero exposure on this app's actual usage.
          allow-ghsas: GHSA-pxg6-pf52-xh8x, GHSA-gmq8-994r-jv83
