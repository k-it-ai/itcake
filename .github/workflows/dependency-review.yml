name: Dependency review

# `actions/dependency-review-action` is free for public repositories (it
# only needs GitHub Advanced Security on private ones). Every PR that touches
# a dependency manifest is checked for vulnerable or disallowed licences
# before merge; the weekly security-audit job covers drift between PRs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Add GHSA IDs here only when the same IDs are listed in
          # .github/acknowledged-advisories.json and justified in the
          # "Upstream advisories" section of README.md.
