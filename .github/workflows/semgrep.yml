name: Semgrep

# Static analysis via Semgrep OSS — replaces CodeQL on this private repo
# (CodeQL needs GitHub Advanced Security, which isn't purchased here).
# Runs the curated security audit rulesets on every PR + a weekly scan
# so newly-published rules catch existing code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/secrets
            p/typescript
            p/javascript
            p/nodejs
            p/golang
            p/owasp-top-ten
            p/r2c-security-audit
        run: semgrep ci --error
