name: SBOM

# Generates CycloneDX SBOMs for the npm tree + the Go agent module on a
# weekly cadence and on every push to main. Uploaded as workflow artifacts
# (retained 90 days) so a build can always be traced back to the exact
# dependency set that produced it without leaning on the GitHub UI's
# inferred dependency graph.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-sbom:
    name: npm SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --output-format JSON \
            --output-file sbom-npm.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-npm
          path: sbom-npm.cdx.json
          retention-days: 90

  go-sbom:
    name: Go agent SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: agent/go.sum
      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - name: Generate Go SBOM
        run: |
          cyclonedx-gomod mod \
            -licenses \
            -json \
            -output sbom-agent.cdx.json \
            ./agent
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-agent
          path: sbom-agent.cdx.json
          retention-days: 90
