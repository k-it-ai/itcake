name: CodeQL

# GitHub's static-analysis pipeline. Free for public repos; on private
# repos it requires GitHub Advanced Security (paid). When GHAS is not
# enabled, the analyze step succeeds but the SARIF upload fails — which
# is why this workflow only runs on workflow_dispatch for now. Flip the
# triggers back to push/pull_request once GHAS is purchased OR the repo
# goes public.
#
# Until then: weekly npm audit + actionlint + dependency-review cover
# the same surface area for free.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v4
