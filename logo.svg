<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle glow -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" filter="url(#glow)" opacity="0.15"/>
  
  <!-- Main logo: stylized "ITC" with cake layers -->
  <g transform="translate(100, 100)">
    <!-- Cake base layer -->
    <ellipse cx="0" cy="15" rx="45" ry="12" fill="#f97316" opacity="0.9"/>
    <ellipse cx="0" cy="15" rx="42" ry="9" fill="#fb923c" opacity="0.7"/>
    
    <!-- Cake middle layer -->
    <ellipse cx="0" cy="-5" rx="38" ry="12" fill="#ef4444" opacity="0.9"/>
    <ellipse cx="0" cy="-5" rx="35" ry="9" fill="#f87171" opacity="0.7"/>
    
    <!-- Cake top layer -->
    <ellipse cx="0" cy="-25" rx="30" ry="12" fill="#a855f7" opacity="0.9"/>
    <ellipse cx="0" cy="-25" rx="27" ry="9" fill="#c084fc" opacity="0.7"/>
    
    <!-- Candle -->
    <rect x="-3" y="-55" width="6" height="30" fill="#eab308" rx="1"/>
    <ellipse cx="0" cy="-55" rx="3" ry="2" fill="#fde047"/>
    
    <!-- Flame -->
    <path d="M0 -60 Q-5 -75 0 -80 Q5 -75 0 -60" fill="#fbbf24" opacity="0.9">
      <animate attributeName="d" values="M0 -60 Q-5 -75 0 -80 Q5 -75 0 -60;M0 -60 Q-3 -78 0 -82 Q3 -78 0 -60;M0 -60 Q-5 -75 0 -80 Q5 -75 0 -60" dur="0.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- ITC text -->
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="2">ITC</text>
    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="3">CAKE</text>
  </g>
</svg>
